/pcd_subsriber:
  ros__parameters:
    continuous_saving: true
    continuous_saving_rate: 2.0 # in sec
    pointcloud_buffer_size: 128 # in MB
    frame_id: 'map'
    pcd_file_path: '~/pcl_luminar/cont_2/test2' ## it will add .pcd
    field_to_save: 'rgb'
    qos_overrides:
      /parameter_events:
        publisher:
          depth: 1000
          durability: volatile
          history: keep_last
          reliability: best_effort
    topic_name: '/points_color'
    use_sim_time: false

